# coturn para as ligações do Chat. Copie para /etc/turnserver.conf e troque:
#   SEU_IP        -> IP público da VPS (ex.: 66.70.214.163)
#   SEU_DOMINIO   -> domínio do chat com certificado (ex.: chat.66-70-214-163.sslip.io)
#   SEGREDO       -> mesmo valor de TURN_SECRET no server/.env (gere com: openssl rand -hex 32)

listening-port=3478
tls-listening-port=5349
external-ip=SEU_IP
realm=SEU_DOMINIO
server-name=SEU_DOMINIO

# Senhas temporárias: o servidor do Chat assina cada uma com este segredo (TURN REST API).
use-auth-secret
static-auth-secret=SEGREDO
fingerprint
stale-nonce=600

# Faixa de portas UDP para retransmitir áudio/vídeo (liberar no firewall).
min-port=49152
max-port=65535

# TLS na 5349 (redes que bloqueiam UDP). Cópia do Let's Encrypt feita pelo hook coturn-cert.sh.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

# Segurança: só serve como ponte para a internet, nunca para a rede interna da VPS
# (Postgres, pdv-api, painel do provedor...).
no-cli
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limites contra abuso (por usuário e no total).
user-quota=12
total-quota=200

simple-log
