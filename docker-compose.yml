# Serviços de apoio. Só é necessário se você NÃO tem PostgreSQL instalado.
#   docker compose up -d            -> PostgreSQL
#   docker compose --profile redis up -d   -> PostgreSQL + Redis (opcional)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      # Só localhost: o banco nunca deve ficar acessível pela rede.
      - '127.0.0.1:5432:5432'
    volumes:
      - chat-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ['redis']
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'

volumes:
  chat-pgdata:
