# App Android → APK assinado, publicado em Releases (link para baixar e instalar).
# Rodar: aba Actions › "Android (APK)" › Run workflow.
#
# Segredos (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE_BASE64    conteúdo de android-keystore/chat-release.jks.base64
#   ANDROID_KEYSTORE_PASSWORD  senha em android-keystore/senha.txt
#   GOOGLE_SERVICES_JSON       conteúdo do google-services.json do Firebase (notificações; opcional)
# A MESMA chave precisa assinar todas as versões, senão o Android não deixa atualizar o app.

name: Android (APK)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do app (ex.: 1.0.0)"
        required: true
        default: 1.0.0

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      CHAT_SERVER_URL: ${{ vars.CHAT_SERVER_URL }}
      ANDROID_VERSION_NAME: ${{ inputs.version }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Conferir versão
        env:
          V: ${{ inputs.version }}
        run: '[[ "$V" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Versão inválida: $V"; exit 1; }'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Firebase (notificações)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json; echo "com Firebase"; else echo "sem Firebase: APK sem notificações"; fi

      - name: Front-end e projeto Android
        run: |
          npm ci
          npm run generate
          npx cap sync android

      - name: Gerar o APK assinado
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/chat-release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/chat-release.jks"
          cd android && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Zynko-${{ inputs.version }}.apk"

      - name: Publicar em Releases
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${{ inputs.version }}-${{ github.run_number }}" "Zynko-${{ inputs.version }}.apk" \
            --title "Zynko ${{ inputs.version }} (Android)" \
            --notes "Baixe o arquivo Zynko-${{ inputs.version }}.apk no celular Android e abra para instalar."
