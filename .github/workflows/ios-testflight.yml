# App de iPhone → TestFlight, compilado num Mac do GitHub (não precisa de Mac).
# Rodar: aba Actions › "iOS (TestFlight)" › Run workflow.
#
# Segredos (Settings › Secrets and variables › Actions):
#   ASC_ISSUER_ID        Issuer ID da chave de API do App Store Connect
#   ASC_KEY_ID           Key ID da chave de API
#   ASC_PRIVATE_KEY      conteúdo do arquivo AuthKey_XXXX.p8
#   IOS_CERTIFICATE_KEY  chave RSA privada usada para criar o certificado de distribuição
# Variável opcional: CHAT_SERVER_URL (endereço do servidor; padrão em web/capacitor.config.ts).

name: iOS (TestFlight)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versão do app (ex.: 1.0.0)
        required: true
        default: 1.0.0

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    env:
      BUNDLE_ID: com.savioalves.chat
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_CERTIFICATE_KEY }}
      CHAT_SERVER_URL: ${{ vars.CHAT_SERVER_URL }}
      APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Conferir versão
        run: |
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Versão inválida: $APP_VERSION"; exit 1; }

      - name: Front-end e projeto iOS
        run: |
          npm ci
          npm run generate
          npx cap sync ios

      # Ferramentas do Codemagic (código aberto): criam certificado e perfil pela API da Apple.
      - name: Assinatura (certificado + perfil da App Store)
        run: |
          pipx install codemagic-cli-tools
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Versão e número do build
        run: |
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $APP_VERSION;/" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" ios/App/App.xcodeproj/project.pbxproj

      - name: Gerar o .ipa
        run: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App

      - name: Enviar para o TestFlight
        run: app-store-connect publish --path "build/ios/ipa/*.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: Chat-${{ inputs.version }}-${{ github.run_number }}
          path: web/build/ios/ipa/*.ipa
          retention-days: 14
